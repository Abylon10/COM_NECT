<text id="A one-day summit for young leaders aged " x="16.0" y="631.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">A one-day summit for young leaders aged 15–24.</text>
<text id="Talks from local officials and student l" x="16.0" y="653.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">Talks from local officials and student leaders,</text>
<text id="workshops on project planning and public" x="16.0" y="675.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">workshops on project planning and public speaking,</text>
<text id="and a networking lunch." x="16.0" y="697.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">and a networking lunch.</text>
</g>
<text id="Section/How to join" x="16.0" y="744.0" font-family="Inter" font-size="17" font-weight="600" fill="#ECEDEE">How to join</text>
<g id="Paragraph 2">
<text id="Free. Pre-register at your barangay SK o" x="16.0" y="773.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">Free. Pre-register at your barangay SK office or</text>
<text id="through the SK Federation page before Oc" x="16.0" y="795.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">through the SK Federation page before Oct 8. Bring a</text>
<text id="valid school or government ID." x="16.0" y="817.0" font-family="Inter" font-size="14" font-weight="400" fill="#ECEDEE">valid school or government ID.</text>
